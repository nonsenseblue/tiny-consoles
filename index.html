<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tiny-consoles</title>
<meta name="description" content="Small design experiments, collected over time. By nonsenseblue.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/gallery.css">
<script type="module" src="scripts/gallery.js"></script>
</head>
<body>

<header class="wrap">
  <div class="owner"><a href="https://github.com/nonsenseblue">nonsenseblue</a> / <a href="https://github.com/nonsenseblue/tiny-consoles">tiny-consoles</a></div>
  <h1>tiny-consoles</h1>
  <p class="lede">Small design experiments, collected over time. Each one is a Web Component you can drop into any page with a single tag.</p>
  <nav class="index" id="index"></nav>
</header>

<main id="pieces"></main>

<footer class="wrap">
  <div class="row">
    <span>Code: MIT · Visual design: CC BY 4.0</span>
    <span>Made by <a href="https://github.com/nonsenseblue">nonsenseblue</a> with Claude</span>
  </div>
</footer>

<!-- one entry in the index -->
<template id="index-item">
  <a><span></span><b></b></a>
</template>

<!-- one piece: filled in from pieces.json -->
<template id="piece">
  <section class="piece">
    <div class="wrap">
      <div class="meta">
        <div>
          <div class="num"></div>
          <h2></h2>
          <p></p>
        </div>
        <div class="chips"></div>
      </div>
      <div class="stage"></div>
      <div class="use">
        <pre></pre>
        <button type="button">Copy</button>
      </div>
    </div>
  </section>
</template>

</body>
</html>
