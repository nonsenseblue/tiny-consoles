# Deploy the gallery to GitHub Pages on every push to main
name: Deploy gallery to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stamp asset URLs with the commit
        # the page, its script and its styles always arrive as one version, so a cached old script never meets a new page
        run: sed -i -E "s#(styles/gallery\.css|scripts/gallery\.js)\"#\1?v=${GITHUB_SHA::7}\"#g" index.html && grep -n "?v=" index.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
